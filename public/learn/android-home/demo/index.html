<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta data-composition-id="disruptiv-launcher" data-width="852" data-height="1847">
<title>Your home screen — browser example</title>
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="launcher-ui.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:852px;height:1847px;overflow:hidden;background:#efe7e0}
.viewport{position:relative;width:852px;height:1847px;overflow:hidden}
#launcher{position:relative;width:852px;height:1847px;overflow:hidden;transform-origin:top left;transform:scale(var(--preview-scale,1));background:#efe7e0}
.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.collage{position:absolute;left:0;top:560px;width:852px;height:536px;overflow:hidden;background:#efe7e0;clip-path:polygon(0 5%,5% 4%,9% 7%,14% 4%,20% 6%,25% 2%,30% 5%,35% 3%,41% 6%,47% 3%,53% 5%,58% 2%,64% 5%,70% 1%,76% 4%,82% 1%,88% 4%,94% 2%,100% 0,100% 96%,94% 98%,88% 96%,82% 99%,76% 97%,70% 100%,64% 97%,58% 99%,52% 97%,46% 100%,40% 97%,34% 99%,28% 96%,22% 99%,16% 97%,10% 100%,4% 97%,0 99%)}
.region,.print{position:absolute;inset:0;overflow:hidden}.print{opacity:0;transform-origin:50% 50%}.print:first-child{opacity:1}.print img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.cube{position:absolute;left:50%;top:50%;width:470px;height:470px;transform:translate(-50%,-50%);z-index:3;filter:drop-shadow(0 8px 9px #16181a22)}
.cube canvas{display:block;width:100%;height:100%}
.motion-control{display:none;position:fixed;right:15px;bottom:15px;width:46px;height:46px;border:1px solid #16181a55;border-radius:50%;background:#f8f4ef;color:#16181a;font:20px Arial;z-index:10;cursor:pointer}
body.preview{width:100vw;height:100dvh;display:grid;place-items:center;background:#ded5cd}
body.preview .viewport{width:min(100vw,calc(100dvh * 852 / 1847));height:min(100dvh,calc(100vw * 1847 / 852))}
body.preview .motion-control{display:block}
.paused .cube{filter:drop-shadow(0 8px 9px #16181a22)}
</style>
</head>
<body>
<div class="viewport">
<main id="launcher" data-composition-id="disruptiv-launcher" data-start="0" data-width="852" data-height="1847" aria-label="Animated Disruptiv launcher visual concept">
  <img class="base" src="assets/launcher.png" alt="Disruptiv launcher concept with paper background, clock, focus card, and icon-only dock">
  <div class="collage" aria-label="Animated paper collage with original Disruptiv cube animation">
    <div id="regions"></div>
    <div class="cube"><canvas id="cube" width="480" height="480" aria-label="Exploding cube logo"></canvas></div>
  </div>
  <section class="paper-ui" aria-label="Your shortcuts and next move">
    <button class="next-move" id="next-move" data-action="task" aria-label="Open next task">
      <span class="next-copy"><span class="next-heading"><span>Next move</span><small id="task-checked">AgentOps</small></span><strong id="task-title">Open AgentOps</strong></span>
      <span class="next-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M5 5h14v14"/></svg></span>
    </button>
    <h2 class="shortcuts-heading">Within reach</h2>
    <nav class="app-shortcuts" id="app-shortcuts" aria-label="App shortcuts"></nav>
    <div class="everyday-controls" aria-label="Everyday controls">
      <button data-action="timer"><span data-icon="timer" aria-hidden="true"></span><span id="timer-label">25 min focus</span></button>
      <button data-action="search"><span data-icon="search" aria-hidden="true"></span><span>Search</span></button>
      <button data-action="capture"><span data-icon="note" aria-hidden="true"></span><span>Quick note</span></button>
    </div>
    <nav class="icon-dock" aria-label="Everyday apps">
      <a href="tel:" aria-label="Phone"><span data-icon="phone" aria-hidden="true"></span></a>
      <a href="sms:" aria-label="Messages"><span data-icon="messages" aria-hidden="true"></span></a>
      <button class="capture-orb" data-action="capture" aria-label="Capture a thought"><span data-icon="mic" aria-hidden="true"></span></button>
      <button data-action="search" aria-label="Browser"><span data-icon="globe" aria-hidden="true"></span></button>
      <button data-action="apps" aria-label="All apps"><span data-icon="grid" aria-hidden="true"></span></button>
    </nav>
    <div class="gesture-bar" aria-hidden="true"></div>
  </section>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="launcher-sheet" id="launcher-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <header><h2 id="sheet-title"></h2><button id="close-sheet" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
    <div id="sheet-content"></div>
  </section>
  <div class="launcher-toast" id="launcher-toast" role="status" hidden></div>
  <input id="file-picker" type="file" hidden>
  <input id="camera-picker" type="file" accept="image/*" capture="environment" hidden>
</main>
</div>
<button class="motion-control" id="motion-control" aria-label="Pause animation" title="Pause animation">Ⅱ</button>
<script>
(() => {
  const preview = new URLSearchParams(location.search).has('preview');
  if(preview) document.body.classList.add('preview');
  const fit = () => { if(preview) document.getElementById('launcher').style.setProperty('--preview-scale',document.querySelector('.viewport').getBoundingClientRect().width/852); };
  addEventListener('resize',fit);fit();
  const shapes = [
    'polygon(0 0,65% 0,62% 18%,56% 25%,58% 31%,50% 50%,30% 35%,17% 37%,0 32%)',
    'polygon(65% 0,100% 0,100% 56%,85% 54%,75% 58%,50% 50%,58% 31%,56% 25%,62% 18%)',
    'polygon(100% 56%,100% 100%,60% 100%,62% 85%,56% 78%,50% 50%,75% 58%,85% 54%)',
    'polygon(60% 100%,0 100%,0 75%,17% 78%,28% 70%,50% 50%,56% 78%,62% 85%)',
    'polygon(0 75%,0 32%,17% 37%,30% 35%,50% 50%,28% 70%,17% 78%)'
  ];
  const variants = ['exchange','making','connection'];
  const regions = document.getElementById('regions');
  shapes.forEach(shape => { const el=document.createElement('div');el.className='region';el.style.clipPath=shape;el.innerHTML=variants.map(name=>`<div class="print"><img src="assets/${name}.png" alt=""></div>`).join('');regions.append(el); });
  const frameDuration=[850,150,150,150,150,150,150,150,500,150,150,150,150,150,150,150];
  const frameImages=frameDuration.map((_,i)=>{const img=new Image();img.src=`assets/cube-${String(i).padStart(2,'0')}.png`;return img});
  const canvas=document.getElementById('cube'),ctx=canvas.getContext('2d');
  const state={time:0},duration=41.4;
  let lastFrame=-1;
  const draw=()=>{let local=((state.time%3.45)+3.45)%3.45*1000;let frame=0;while(frame<15&&local>=frameDuration[frame])local-=frameDuration[frame++];if(frame!==lastFrame&&frameImages[frame].complete){ctx.clearRect(0,0,480,480);ctx.drawImage(frameImages[frame],0,0);lastFrame=frame}};
  window.__timelines=window.__timelines||{};
  const tl=gsap.timeline({paused:true});
  tl.to(state,{time:duration,duration,ease:'none',onUpdate:draw},0);
  for(let step=0;step<15;step++){
    const region=regions.children[step%5],oldVariant=Math.floor(step/5)%3,newVariant=(oldVariant+1)%3;
    const at=step*2.76+0.8;
    tl.to(region.children[oldVariant],{opacity:0,duration:.72,ease:'power2.inOut'},at);
    tl.fromTo(region.children[newVariant],{opacity:0,x:(step%2?8:-8),y:5},{opacity:1,x:0,y:0,duration:.72,ease:'power2.inOut',immediateRender:false},at);
  }
  window.__timelines['disruptiv-launcher']=tl;
  window.launcherPreview={timeline:tl,seek:t=>{tl.pause().seek(t);draw()},duration,assetFrameCount:16};
  Promise.all([document.fonts.ready,...[...document.images,...frameImages].map(img=>img.decode().catch(()=>{}))]).then(()=>{
    draw();document.body.dataset.ready='true';
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const button=document.getElementById('motion-control');
    let wantsMotion=preview&&!reduced,hostVisible=window.launcherPreview.visible!==false;
    const sync=()=>{button.textContent=tl.paused()?'▶':'Ⅱ';button.setAttribute('aria-label',tl.paused()?'Play animation':'Pause animation')};
    const resumeMotion=()=>{if(hostVisible&&!document.hidden&&wantsMotion&&!reduced)tl.repeat(-1).play();else tl.pause();sync()};
    window.launcherPreview.setVisible=visible=>{hostVisible=visible;window.launcherPreview.visible=visible;resumeMotion()};
    button.onclick=()=>{wantsMotion=!wantsMotion;resumeMotion()};
    document.addEventListener('visibilitychange',resumeMotion);resumeMotion();
  });
})();
</script>
<script src="demo-ui.js"></script>
</body>
</html>
