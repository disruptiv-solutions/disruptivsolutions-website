<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe7e0">
  <meta name="robots" content="noindex,follow">
  <title>My Card</title>
  <link rel="canonical" href="https://www.ianmcdonald.ai/card">
  <link rel="manifest" href="/card/manifest.webmanifest">
  <link rel="icon" href="/card/assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/card/assets/icon-192.png">
  <link rel="stylesheet" href="/card/qr.css">
  <link rel="preload" href="/card/assets/rosario.woff2" as="font" type="font/woff2" crossorigin>
  <script defer src="/card/config.js"></script>
  <script defer src="/card/assets/qrcode.js"></script>
  <script defer src="/card/qr.js"></script>
</head>
<body>
  <main class="phone-card">
    <header>
      <p class="tape-label">GOOD TO CONNECT.</p>
      <h1>Ian McDonald<span>.</span></h1>
      <p class="role">Practical AI builder.</p>
    </header>
    <section class="scan-section" aria-labelledby="scan-title">
      <div class="qr-code" id="phone-qr" aria-live="polite"></div>
      <h2 id="scan-title">Scan to connect.</h2>
      <p>My links, community &amp; a 15-minute call.</p>
    </section>
    <footer><a href="/card">Open my links <span aria-hidden="true">↗</span></a></footer>
  </main>
</body>
</html>
